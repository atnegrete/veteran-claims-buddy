name: Preview

# On every pull request: build the Flutter web app for dev and publish it to a
# Firebase Hosting preview channel on the `app` site. The ephemeral preview URL
# is posted back as a comment on the PR. Scoped to the `app` target only, so
# Functions, Firestore, rules, Storage, and the marketing site are untouched.
on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - name: Install app dependencies
        run: flutter pub get
        working-directory: app
      - name: Build web (dev)
        run: flutter build web --dart-define=APP_ENV=dev
        working-directory: app
      - name: Deploy to Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VETERAN_CLAIMS_BUDDY_DEV }}
          projectId: veteran-claims-buddy-dev
          target: app
          expires: 7d
